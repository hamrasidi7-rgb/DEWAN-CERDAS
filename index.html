document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        if (!entry.compressed && entry.mime.indexOf('image/') === 0) {
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' + entry.data;
          return;
        }
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yle=\"flex:1;height:46px;border-radius:13px;border:none;cursor:pointer;font-size:13.5px;font-weight:600;color:#fff;background:var(--dark);display:flex;align-items:center;justify-content:center;gap:7px\" style-hover=\"background:#343B46\" style-active=\"transform:scale(.97)\">\n              <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 11.5a8.4 8.4 0 01-8.5 8.5 8.5 8.5 0 01-3.8-.9L3 21l1.9-5.7A8.4 8.4 0 014 11.5 8.5 8.5 0 0112.5 3 8.4 8.4 0 0121 11.5z\"></path></svg>\n              Mulai Chat AI\n            </button>\n            <button onclick=\"{{ viewProfile }}\" style=\"height:46px;padding:0 18px;border-radius:13px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--text);background:#fff;border:1px solid var(--border2)\" style-hover=\"background:#F4F7FB\" style-active=\"transform:scale(.97)\">Lihat Profil</button>\n          </div>\n        </div>\n      </div>\n    </div>\n  </sc-if>\n\n  <!-- ===== CHAT DRAWER ===== -->\n  <sc-if value=\"{{ chatOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeChat }}\" style=\"{{ overlayStyle }}\">\n      <div onclick=\"{{ stop }}\" style=\"{{ panelStyle }}\">\n        <div style=\"flex-shrink:0;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)\">\n          <div style=\"display:flex;align-items:center;gap:11px\">\n            <div style=\"width:38px;height:38px;border-radius:12px;background:var(--dark);display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6L12 3z\"></path></svg></div>\n            <div style=\"display:flex;flex-direction:column;gap:3px\">\n              <div style=\"font-size:14.5px;font-weight:700;line-height:1\">Chat<span style=\"color:#C0552F\">AI</span> Asisten</div>\n              <div style=\"font-size:11px;line-height:1;color:#3C7B5A;display:flex;align-items:center;gap:5px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#5FA87E;display:inline-block;flex-shrink:0\"></span>Daring 24 jam</div>\n            </div>\n          </div>\n          <button onclick=\"{{ closeChat }}\" style=\"width:36px;height:36px;border-radius:11px;background:#fff;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center\" style-active=\"transform:scale(.92)\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--text)\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6L6 18\"></path></svg></button>\n        </div>\n        <div ref=\"{{ threadRef }}\" data-hs=\"\" style=\"flex:1;overflow-y:auto;padding:20px 18px 12px;display:flex;flex-direction:column;gap:13px\">\n          <sc-for list=\"{{ messages }}\" as=\"msg\" hint-placeholder-count=\"1\">\n            <div style=\"{{ msg.rowStyle }}\"><div style=\"{{ msg.bubbleStyle }}\">{{ msg.text }}</div></div>\n          </sc-for>\n          <sc-if value=\"{{ typing }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"align-self:flex-start;display:flex;gap:4px;padding:13px 15px;border-radius:15px 15px 15px 5px;background:#EBEFF5;border:1px solid var(--border)\">\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#959DAA;animation:m-dots 1.2s infinite\"></span>\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#959DAA;animation:m-dots 1.2s .2s infinite\"></span>\n              <span style=\"width:6px;height:6px;border-radius:50%;background:#959DAA;animation:m-dots 1.2s .4s infinite\"></span>\n            </div>\n          </sc-if>\n        </div>\n        <div style=\"flex-shrink:0;padding:14px 16px;border-top:1px solid var(--border)\">\n          <div style=\"display:flex;align-items:flex-end;gap:9px;padding:8px 8px 8px 15px;border-radius:16px;background:#fff;border:1px solid var(--border2)\">\n            <textarea value=\"{{ draft }}\" onchange=\"{{ onDraft }}\" onkeydown=\"{{ onKey }}\" rows=\"1\" placeholder=\"Tulis pertanyaan Anda…\" style=\"flex:1;min-width:0;border:none;outline:none;resize:none;background:transparent;color:var(--text);font-size:14px;line-height:1.45;max-height:90px;padding:7px 0\"></textarea>\n            <button onclick=\"{{ send }}\" style=\"flex-shrink:0;width:40px;height:40px;border-radius:12px;border:none;cursor:pointer;background:var(--dark);display:flex;align-items:center;justify-content:center\" style-active=\"transform:scale(.93)\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 19V5\"></path><path d=\"M6 11l6-6 6 6\"></path></svg></button>\n          </div>\n        </div>\n      </div>\n    </div>\n  </sc-if>\n\n</div>\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.rootRef = React.createRef();\n    this.scrollRef = React.createRef();\n    this.threadRef = React.createRef();\n    this._id = 1;\n    this.AREA = {1:'Kota Sumenep · Kalianget · Talango · Batuan',2:'Bluto · Saronggi · Lenteng · Giligenteng',3:'Guluk-Guluk · Ganding · Pragaan',4:'Ambunten · Pasongsongan · Rubaru',5:'Manding · Dasuk · Batuputih',6:'Batang Batang · Dungkek · Gapura',7:'Gayam · Nonggunong · Raas · Masalembu',8:'Arjasa · Sapeken · Kangayan'};\n    this.MEMBERS = [\n      {name:'H. Zainal Arifin',partai:'PDI-P',d:4,jabatan:'Ketua DPRD'},\n      {name:'M. Syukri',partai:'PPP',d:8,jabatan:'Wakil Ketua DPRD'},\n      {name:'Dulsiam',partai:'PKB',d:8,jabatan:'Wakil Ketua DPRD'},\n      {name:'Indra Wahyudi',partai:'Demokrat',d:4,jabatan:'Wakil Ketua DPRD'},\n      {name:'Darul Hasyim Fath',partai:'PDI-P',d:7,jabatan:'Ketua Komisi I'},\n      {name:'Faisal Muhlis',partai:'PAN',d:2,jabatan:'Ketua Komisi II'},\n      {name:'M. Muhri',partai:'PKB',d:5,jabatan:'Ketua Komisi III'},\n      {name:'Mulyadi',partai:'Demokrat',d:6,jabatan:'Ketua Komisi IV'},\n      {name:'Akhmad Jazuli',partai:'Demokrat',d:3,jabatan:'Wakil Ketua Komisi I'},\n      {name:'Irwan Hayat',partai:'PKB',d:3,jabatan:'Wakil Ketua Komisi II'},\n      {name:'Wahyudi',partai:'PDI-P',d:8,jabatan:'Wakil Ketua Komisi III'},\n      {name:\"Moh. Asy'ari Motkhar\",partai:'PPP',d:3,jabatan:'Wakil Ketua Komisi IV'},\n      {name:'Saipur Rahman',partai:'PKB',d:7,jabatan:'Sekretaris Komisi I'},\n      {name:'Abd. Rahman',partai:'PDI-P',d:3,jabatan:'Sekretaris Komisi II'},\n      {name:'Wiwid Harjo Yudanto',partai:'PKS',d:1,jabatan:'Sekretaris Komisi III'},\n      {name:'Afrilia Wahyuni',partai:'NasDem',d:5,jabatan:'Sekretaris Komisi IV'},\n      {name:'Holik',partai:'Gerindra',d:2,jabatan:'Anggota Komisi I'},\n      {name:'Hairul Anwar',partai:'PAN',d:4,jabatan:'Anggota Komisi I'},\n      {name:'Ahmad Juhairi',partai:'NasDem',d:7,jabatan:'Anggota Komisi I'},\n      {name:'Sutan Hady Tjahyadi',partai:'PDI-P',d:1,jabatan:'Anggota Komisi I'},\n      {name:'Muhammad Mirza Khumaini Hamid',partai:'PKB',d:4,jabatan:'Anggota Komisi I'},\n      {name:'Agus Hariyanto',partai:'Gerindra',d:1,jabatan:'Anggota Komisi II'},\n      {name:'Gunaifi Syarif Arrodi',partai:'PAN',d:6,jabatan:'Anggota Komisi II'},\n      {name:'Juhari',partai:'PPP',d:6,jabatan:'Anggota Komisi II'},\n      {name:'Samsiyadi',partai:'NasDem',d:2,jabatan:'Anggota Komisi II'},\n      {name:'Ersat',partai:'NasDem',d:4,jabatan:'Anggota Komisi II'},\n      {name:'Salahuddin',partai:'PDI-P',d:2,jabatan:'Anggota Komisi II'},\n      {name:'Endi',partai:'PDI-P',d:5,jabatan:'Anggota Komisi II'},\n      {name:'Rasiidi',partai:'PKB',d:1,jabatan:'Anggota Komisi II'},\n      {name:'Moh. Fendi',partai:'Demokrat',d:5,jabatan:'Anggota Komisi II'},\n      {name:'Masdawi',partai:'Demokrat',d:6,jabatan:'Anggota Komisi II'},\n      {name:'Musahwi',partai:'PAN',d:1,jabatan:'Anggota Komisi III'},\n      {name:\"Mas'ud Ali\",partai:'PPP',d:7,jabatan:'Anggota Komisi III'},\n      {name:'Abd. Rahman',partai:'PPP',d:4,jabatan:'Anggota Komisi III'},\n      {name:\"Muta'em\",partai:'NasDem',d:8,jabatan:'Anggota Komisi III'},\n      {name:'Badrul Aini',partai:'PBB',d:8,jabatan:'Anggota Komisi III'},\n      {name:'Eka Bahas Nur Ardiansyah',partai:'PDI-P',d:2,jabatan:'Anggota Komisi III'},\n      {name:'Hosnan',partai:'PDI-P',d:7,jabatan:'Anggota Komisi III'},\n      {name:'Akhmadi Yazid',partai:'PKB',d:2,jabatan:'Anggota Komisi III'},\n      {name:'Eksan',partai:'PKB',d:3,jabatan:'Anggota Komisi III'},\n      {name:'Afrian Mukhlash',partai:'Demokrat',d:2,jabatan:'Anggota Komisi III'},\n      {name:'Mohammad Hanafi',partai:'Demokrat',d:8,jabatan:'Anggota Komisi III'},\n      {name:'Siti Hosna',partai:'PAN',d:3,jabatan:'Anggota Komisi IV'},\n      {name:'Syamsul Bahri',partai:'PKS',d:8,jabatan:'Anggota Komisi IV'},\n      {name:'Nia Kurnia',partai:'PDI-P',d:1,jabatan:'Anggota Komisi IV'},\n      {name:'Umar',partai:'PDI-P',d:6,jabatan:'Anggota Komisi IV'},\n      {name:'M. Ramzi',partai:'Hanura',d:3,jabatan:'Anggota Komisi IV'},\n      {name:'Sami Oeddin',partai:'PKB',d:6,jabatan:'Anggota Komisi IV'},\n      {name:'Virzannida',partai:'PKB',d:5,jabatan:'Anggota Komisi IV'},\n      {name:'Hairul Anam',partai:'PPP',d:1,jabatan:'Anggota DPRD'}\n    ];\n  }\n\n  state = { w:1280, draft:'', typing:false, chatOpen:false, menuOpen:false, persona:null, view:'home', activeNav:'Beranda',\n    q:'', fraksi:'all', dapil:'all',\n    messages:[{id:0, role:'ai', text:'Halo, saya Chat AI DPRD Kabupaten Sumenep. Ada yang dapat saya bantu hari ini?'}] };\n\n  componentDidMount(){\n    this._onResize = ()=>{ const el=this.rootRef.current; const w=el?el.clientWidth:window.innerWidth; if(Math.abs(w-this.state.w)>0) this.setState({w}); };\n    window.addEventListener('resize', this._onResize);\n    this._onResize();\n    this._paintIcons();\n  }\n  componentWillUnmount(){ window.removeEventListener('resize', this._onResize); }\n  componentDidUpdate(){ const t=this.threadRef.current; if(t){ t.scrollTop=t.scrollHeight; } this._paintIcons(); }\n\n  scrollTo(id){ const el=this.scrollRef.current; if(!el) return; const t=el.querySelector('#'+id); if(!t) return; const r=t.getBoundingClientRect(); const er=el.getBoundingClientRect(); el.scrollTo({top: el.scrollTop + (r.top-er.top) - 16, behavior:'smooth'}); }\n\n  addUser(text){ this.setState(s=>({messages:[...s.messages,{id:this._id++,role:'user',text}]})); }\n  respond(text){ this.setState({typing:true}); setTimeout(()=>{ this.setState(s=>({typing:false, messages:[...s.messages,{id:this._id++,role:'ai',text}]})); }, 760); }\n  ask = (q)=>{ this.setState({chatOpen:true, menuOpen:false}); this.addUser(q); this.respond(this.answerFor(q)); };\n  send = ()=>{ const d=this.state.draft.trim(); if(!d) return; this.setState({draft:'', chatOpen:true}); this.addUser(d); this.respond(this.answerFor(d)); };\n  newChat = ()=>{ this.setState({chatOpen:true, draft:'', messages:[{id:0,role:'ai',text:'Halo, saya Chat AI DPRD Kabupaten Sumenep. Ada yang dapat saya bantu hari ini?'}]}); this._id=1; };\n  newChatMenu = ()=>{ this.setState({menuOpen:false}); this.newChat(); };\n  openChat = ()=> this.setState({chatOpen:true});\n  closeChat = ()=> this.setState({chatOpen:false});\n  initials(name){ const w=name.replace(/[.,]/g,'').split(/\\s+/).filter(Boolean); return w.slice(-2).map(x=>x[0]).join('').toUpperCase(); }\n  gradFor(i){ const a=['#8A8F98','#94897B','#7E8A86','#8C857C','#828C82','#8E8470']; const c=a[i%a.length]; return { position:'absolute', inset:0, background:`linear-gradient(155deg, ${c}, #4A4945)` }; }\n  openPersona = (em)=> this.setState({persona:em});\n  closePersona = ()=> this.setState({persona:null});\n  startPersonaChat = ()=>{ const m=this.state.persona; if(!m) return; this.setState({persona:null, chatOpen:true}); this.addUser('Saya ingin berbincang dengan '+m.name); this.respond(`Halo, saya ${m.name}, ${m.role} dari Dapil ${m.d} (${m.area}), Fraksi ${m.partai}. Silakan sampaikan pertanyaan atau aspirasi Anda — akan saya bantu jelaskan.`); };\n  viewProfile = ()=>{ const m=this.state.persona; if(!m) return; this.setState({persona:null}); this.ask('Profil '+m.name); };\n  openMenu = ()=> this.setState({menuOpen:true});\n  closeMenu = ()=> this.setState({menuOpen:false});\n  openPersonaPage = ()=>{ this.setState({view:'persona', menuOpen:false, activeNav:'Anggota DPRD'}); const el=this.scrollRef.current; if(el) el.scrollTo({top:0,behavior:'smooth'}); };\n  backHome = ()=>{ this.setState({view:'home', menuOpen:false, activeNav:'Beranda'}); const el=this.scrollRef.current; if(el) el.scrollTo({top:0,behavior:'smooth'}); };\n  stop = (e)=> e.stopPropagation();\n\n  answerFor(q){\n    const s=(q||'').toLowerCase();\n    const hit=this.MEMBERS.find(m=> s.includes(m.name.toLowerCase()) || (m.name.split(/\\s+/).slice(-1)[0]||'').toLowerCase()===s.trim());\n    if(hit) return `${hit.name} menjabat sebagai ${hit.jabatan}, Fraksi ${hit.partai}, daerah pemilihan Dapil ${hit.d} (${this.AREA[hit.d]}). Buka halaman AI Persona untuk berbincang langsung dengan AI Assistant beliau.`;\n    if(s.includes('aspirasi')) return 'Aspirasi masyarakat dapat disampaikan melalui menu Aspirasi, atau langsung kepada anggota DPRD sesuai daerah pemilihan Anda. Setiap aspirasi diteruskan ke komisi terkait untuk ditindaklanjuti.';\n    if(s.includes('apbd')) return 'APBD Kabupaten Sumenep Tahun Anggaran 2026 berada pada kisaran Rp 2,8 Triliun (ilustrasi). Rincian pendapatan, belanja, dan pembiayaan dapat Anda telusuri pada menu APBD.';\n    if(s.includes('komisi')) return 'DPRD Sumenep memiliki empat komisi: Komisi I (Pemerintahan & Hukum), Komisi II (Perekonomian & Keuangan), Komisi III (Pembangunan), dan Komisi IV (Kesejahteraan Rakyat).';\n    if(s.includes('dapil')) return 'Kabupaten Sumenep terbagi atas 8 daerah pemilihan (Dapil I–VIII). Gunakan filter Dapil pada halaman AI Persona untuk menyaring anggota berdasarkan daerah pemilihan.';\n    if(s.includes('ketua')) return 'Ketua DPRD Kabupaten Sumenep periode 2024–2029 dijabat H. Zainal Arifin (PDI-P), didampingi tiga Wakil Ketua: M. Syukri (PPP), Dulsiam (PKB), dan Indra Wahyudi (Demokrat).';\n    if(s.includes('reses')) return 'Jadwal Reses anggota DPRD diselenggarakan tiga kali dalam satu tahun sidang. Agenda terdekat dapat Anda lihat pada menu Reses.';\n    if(s.includes('umkm')) return 'DPRD mendorong penguatan UMKM melalui pelatihan, akses permodalan, dan digitalisasi pemasaran yang dianggarkan dalam APBD bersama Komisi II.';\n    if(s.includes('pokir')) return 'Pokir (Pokok-Pokok Pikiran) DPRD adalah usulan program hasil reses dan penyerapan aspirasi masyarakat yang disampaikan DPRD untuk dibahas bersama Pemerintah Daerah dan diakomodasi dalam APBD.';\n    if(s.includes('perda')||s.includes('peraturan')) return 'Peraturan Daerah yang telah ditetapkan dapat diakses pada menu Perda, lengkap dengan naskah dan tahun penetapannya.';\n    if(s.includes('berita')) return 'Berita dan kegiatan terbaru DPRD — rapat paripurna, kunjungan kerja, hingga reses — dapat Anda ikuti pada menu Berita.';\n    if(s.includes('statistik')) return 'Data statistik daerah mencakup demografi, anggaran, dan capaian program pembangunan Kabupaten Sumenep, tersaji ringkas pada menu Statistik.';\n    if(s.includes('pendidikan')) return 'Sektor pendidikan memperoleh alokasi prioritas dalam APBD, termasuk beasiswa dan perbaikan sarana sekolah di seluruh dapil.';\n    if(s.includes('kesehatan')) return 'Layanan kesehatan masyarakat menjadi perhatian DPRD melalui penguatan Puskesmas dan jaminan kesehatan daerah.';\n    if(s.includes('pariwisata')) return 'Sektor pariwisata Sumenep — wisata bahari, budaya Keraton, dan religi — terus didorong DPRD melalui Komisi II untuk menggerakkan ekonomi lokal.';\n    return 'Terima kasih atas pertanyaan Anda. Saya akan menelusuri informasi publik DPRD Sumenep terkait hal tersebut. Untuk detail lebih lanjut, silakan pilih menu yang relevan.';\n  }\n\n  renderVals(){\n    const w=this.state.w;\n    const isMobile = w<=767;\n    const showSidebar = !isMobile;\n\n    const heroHeadStyle = isMobile\n      ? { display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:'16px', maxWidth:'760px' }\n      : { display:'flex', flexDirection:'row', alignItems:'center', justifyContent:'center', gap:'18px', maxWidth:'760px' };\n    const heroH1Style = { fontFamily:\"'Newsreader',Georgia,serif\", fontWeight:400, fontSize:'clamp(28px,4.4vw,46px)', lineHeight:1.12, letterSpacing:'-.01em', color:'var(--text)', margin:0, textAlign:isMobile?'center':'left', textWrap:'balance' };\n\n    const navSideStyle=(active)=>({ display:'flex', alignItems:'center', gap:'11px', width:'100%', padding:'9px 11px', borderRadius:'10px', border:'none', cursor:'pointer', fontFamily:'inherit', fontSize:'13.5px', fontWeight: active?600:500, color: active?'#262C36':'#5D6470', background: active?'#DFE5EE':'transparent', textAlign:'left', transition:'.15s' });\n\n    const navDefs=[\n      {label:'Beranda', icon:'home', group:'Navigasi', act:()=>this.backHome()},\n      {label:'Anggota DPRD', icon:'dprd', group:'Navigasi', act:()=>this.openPersonaPage()},\n      {label:'APBD', icon:'apbd', group:'Navigasi', act:()=>this.ask('Berapa APBD Kabupaten Sumenep?')},\n      {label:'Perda', icon:'perda', group:'Navigasi', act:()=>this.ask('Apa saja Peraturan Daerah?')},\n      {label:'Aspirasi', icon:'aspirasi', group:'Navigasi', act:()=>this.ask('Bagaimana cara menyampaikan aspirasi?')},\n      {label:'Reses', icon:'reses', group:'Navigasi', act:()=>this.ask('Kapan jadwal Reses?')},\n      {label:'Berita', icon:'berita', group:'Informasi', act:()=>this.ask('Apa berita terbaru DPRD?')},\n      {label:'Statistik', orderLeft:'1px solid #E0E5EC', animation:'m-slideR .34s cubic-bezier(.22,1,.36,1) both' };\n\n    return {\n      rootRef:this.rootRef, scrollRef:this.scrollRef, threadRef:this.threadRef,\n      showSidebar, isMobile, navGroups, heroHeadStyle, heroH1Style,\n      fraksiOptions, dapilOptions, members, services, trending, messages,\n      isHome:this.state.view==='home', isPersonaPage:this.state.view==='persona',\n      openPersonaPage:this.openPersonaPage, backHome:this.backHome,\n      q:this.state.q, fraksi:this.state.fraksi, dapil:this.state.dapil,\n      shownCount:filtered.length, noResults:filtered.length===0,\n      personaOpen:!!this.state.persona, persona:this.state.persona||{},\n      openPersona:this.openPersona, closePersona:this.closePersona, startPersonaChat:this.startPersonaChat, viewProfile:this.viewProfile,\n      draft:this.state.draft, typing:this.state.typing, chatOpen:this.state.chatOpen, menuOpen:this.state.menuOpen,\n      overlayStyle, panelStyle,\n      onSearch:e=>this.setState({q:e.target.value}),\n      onFraksi:e=>this.setState({fraksi:e.target.value}),\n      onDapil:e=>this.setState({dapil:e.target.value}),\n      onDraft:e=>this.setState({draft:e.target.value}),\n      onKey:e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); this.send(); } },\n      send:this.send, newChat:this.newChat, newChatMenu:this.newChatMenu, openChat:this.openChat, closeChat:this.closeChat, openMenu:this.openMenu, closeMenu:this.closeMenu, stop:this.stop,\n      goHome:this.backHome, goPersona:this.openPersonaPage, goLayanan:()=>{ if(this.state.view!=='home'){ this.backHome(); setTimeout(()=>this.scrollTo('layanan'),80); } else this.scrollTo('layanan'); }\n    };\n  }\n\n  _paintIcons(){\n    const el=this.rootRef.current; if(!el) return;\n    const L={\n      apbd:'<rect x=\"3\" y=\"6\" width=\"18\" height=\"13\" rx=\"2.5\"/><path d=\"M3 10.5h18M15.5 14.5h2.5\"/>',\n      perda:'<path d=\"M6 3h9l3 3v15H6z\"/><path d=\"M9 8h6M9 12h6M9 16h4\"/>',\n
